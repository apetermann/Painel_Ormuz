name: Atualizar painel

on:
  schedule:
    - cron: '0 22 * * 1'   # segundas, 19h em Brasília (UTC-3)
  workflow_dispatch:
    inputs:
      lancamentos:
        description: 'Lançamentos manuais, ex.: diesel=6.52@2026-09-15; ureia=610'
        required: false
        default: ''
      sem_ia:
        description: 'Coletar só EIA e Banco Central, sem busca web (o agendamento já faz isso)'
        type: boolean
        default: false
      modelo:
        description: 'Modelo só desta execução, para comparar custo'
        type: choice
        default: 'padrão'
        options: ['padrão', 'claude-haiku-4-5', 'claude-sonnet-5', 'claude-opus-5']
  push:
    branches: [main]
    paths-ignore: ['data/leituras.json', 'data/execucoes.json', 'data/briefings.json']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  coletar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Coletar dados
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAINEL_MODELO: ${{ (github.event.inputs.modelo != '' && github.event.inputs.modelo != 'padrão') && github.event.inputs.modelo || vars.PAINEL_MODELO }}
          # 'off' (padrão): a execução agendada não busca na web e não gera custo; 'auto' devolve a busca semanal
          PAINEL_BUSCA: ${{ vars.PAINEL_BUSCA }}
          PAINEL_LANCAMENTOS: ${{ github.event.inputs.lancamentos }}
          # execução pedida à mão sempre busca; a agendada só se PAINEL_BUSCA=auto
          PAINEL_FORCAR_BUSCA: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/atualizar.mjs ${{ github.event.inputs.sem_ia == 'true' && '--sem-ia' || '' }}
      - name: Gravar no repositório
        run: |
          git config user.name "painel-ormuz[bot]"
          git config user.email "painel-ormuz@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Coleta de $(TZ=America/Sao_Paulo date +%F)"
          git push

  publicar:
    needs: coletar
    if: always() && (needs.coletar.result == 'success' || needs.coletar.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Montar site
        run: |
          mkdir _site
          cp -r index.html assets data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
